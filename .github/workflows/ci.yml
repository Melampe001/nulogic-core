name: NULOGIC_CORE Enterprise CI/CD

on:
  push:
    branches: [ master, staging ]
  pull_request:
    branches: [ master, staging ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Verify Environment and Core Integrity
      run: |
        python -c "print('Python environment verified successfully')"
        python main.py
